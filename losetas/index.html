<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualizador de Losetas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Visualizador de Losetas</h2>

  <div class="input-group">
    <label for="baseWidth">Ancho base:</label>
    <input type="number" id="baseWidth" value="320" step="0.1" min="0.1">
    <label for="baseHeight">Altura base:</label>
    <input type="number" id="baseHeight" value="150" step="0.1" min="0.1">
  </div>

  <div class="input-group">
    <label for="tileWidth">Ancho loseta:</label>
    <input type="number" id="tileWidth" value="120" step="0.1" min="0.1">
    <label for="tileHeight">Altura loseta:</label>
    <input type="number" id="tileHeight" value="60" step="0.1" min="0.1">
  </div>

  <button onclick="drawTiles()">Calcular y ver</button>

  <canvas id="canvas" width="600" height="400"></canvas>

  <p id="resultado"></p>

  <script src="script.js"></script>
</body>
</html>

</html>
