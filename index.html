<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualizador de Losetas </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Visualizador de Losetas 🌊</h1>
  
  <div class="inputs">
    <label>Base (ancho × alto en px):</label>
    <input id="baseWidth" type="number" placeholder="Ancho base">
    <input id="baseHeight" type="number" placeholder="Alto base">
    
    <label>Loseta (ancho × alto en px):</label>
    <input id="tileWidth" type="number" placeholder="Ancho loseta">
    <input id="tileHeight" type="number" placeholder="Alto loseta">
    
    <button onclick="drawTiles()">Generar</button>
  </div>
  
  <p id="resultado"></p>
  
  <canvas id="canvas"></canvas>

  <a href="https://wiiiiiiu.github.io/mi-pagina/" target="_blank" class="btn-oficial">mi sitio :D</a>
  
  <script src="script.js"></script>
</body>
</html>
